name: Publish to NuGet

on:
  push:
    tags:
      # Numeric version tags only, no leading "v" (e.g. 2.1.0)
      - "[0-9]*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Tests/Tests.csproj --configuration Release

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      # Required for NuGet trusted publishing (OIDC token exchange).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/BetterVersioning.net.csproj --configuration Release -p:Version=${{ github.ref_name }} --output ./artifacts
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org account/profile name that owns the package and the trusted publishing policy.
          user: mastermindzh
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
